<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | AKBmusix</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"></head><body><main class="admin-page">
<section id="loginPanel" class="admin-login card"><a class="brand" href="/">AKBmusix</a><h1>Admin Login</h1><form id="loginForm" class="stack-form"><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary-btn">Login</button><p id="loginStatus" class="form-note"></p></form></section>
<section id="adminPanel" hidden><div class="admin-head"><div><a class="brand" href="/">AKBmusix</a><h1>Admin Panel</h1></div><button id="logout" class="btn">Logout</button></div><div id="stats" class="stats-grid"></div><nav class="admin-tabs" aria-label="Admin sections"><button data-tab="songs" class="btn active">Songs</button><button data-tab="comments" class="btn">Comments</button><button data-tab="requests" class="btn">Requests</button></nav>
<section id="songsTab"><div class="admin-section-head"><h2>Songs</h2><button id="newSong" class="primary-btn">Add Song</button></div><div id="songList" class="admin-list"></div></section>
<section id="commentsTab" hidden><h2>Comments</h2><div id="commentList" class="admin-list"></div></section>
<section id="requestsTab" hidden><h2>Requests</h2><div id="requestList" class="admin-list"></div></section>
</section></main>
<dialog id="songDialog"><form id="songForm" class="song-form"><div class="dialog-head"><h2 id="dialogTitle">Add Song</h2><button type="button" id="closeDialog" class="icon-btn" aria-label="Close">×</button></div><input id="songId" type="hidden"><div class="form-grid"><label>Title<input name="title" required maxlength="160"></label><label>Slug<input name="slug" maxlength="120"></label><label>Artist<input name="artist" required maxlength="120"></label><label>Language<select name="language"><option>Bangla</option><option>Hindi</option><option>English</option></select></label><label>Category<input name="category" value="Bangla"></label><label>Key<input name="key" maxlength="20"></label><label>Capo<input name="capo" maxlength="40"></label><label>Tempo<input name="tempo" maxlength="30"></label><label class="wide">Strumming<input name="strumming" maxlength="120"></label><label class="wide">Clean Lyrics<textarea name="lyrics" rows="9"></textarea></label><label class="wide">Lyrics with inline chords<textarea name="chords" rows="9" placeholder="[C] Lyric line"></textarea></label><label class="wide">Media links JSON<textarea name="media" rows="6" placeholder='[{"type":"Guitar Tutorial","platform":"YouTube","label":"Watch","url":"https://..."}]'></textarea></label><label class="wide">SEO title<input name="seoTitle" maxlength="160"></label><label class="wide">Meta description<textarea name="metaDescription" maxlength="300"></textarea></label><label class="wide">Tags<input name="tags" maxlength="500" placeholder="comma, separated"></label><label>Status<select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label><label class="check"><input name="featured" type="checkbox"> Featured</label></div><button class="primary-btn">Save Song</button><p id="songStatus" class="form-note"></p></form></dialog>
<script src="/admin.js" defer></script></body></html>
